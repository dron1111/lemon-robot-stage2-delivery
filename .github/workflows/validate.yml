name: Stage 2 Delivery Validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validator dependencies
        run: python -m pip install 'xacro==2.1.1' 'PyYAML>=6.0.1'
      - name: Install independent URDF parser
        run: |
          sudo apt-get update
          sudo apt-get install -y liburdfdom-tools
      - name: Validate delivery model
        run: python scripts/validate_delivery.py --write-urdf /tmp/lemon_robot.urdf
      - name: Check expanded URDF
        run: check_urdf /tmp/lemon_robot.urdf
      - name: Compile launch and scenario files
        run: |
          python -m py_compile ros2/lemon_robot_description/launch/display.launch.py
          python -m py_compile ros2/lemon_robot_description/launch/sim.launch.py
          python -m py_compile ros2/lemon_robot_description/scripts/stage2_scenario.py
